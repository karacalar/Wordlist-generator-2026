[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "combination-studio"
version = "1.0.0"
description = "Local bounded character combination generator for QA and test data."
requires-python = ">=3.12"
dependencies = ["PySide6>=6.7", "psutil>=5.9"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
